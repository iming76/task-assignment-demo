services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_assignment
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d task_assignment"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/task_assignment?schema=public
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/task_assignment?schema=public
      PORT: 3100
      FRONTEND_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_PLANNING_TIMEOUT_MS: ${AGENT_PLANNING_TIMEOUT_MS:-15000}
      SKILL_INFERENCE_TIMEOUT_MS: ${SKILL_INFERENCE_TIMEOUT_MS:-5000}
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: http://localhost:3100
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
