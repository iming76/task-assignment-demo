schema: spec-driven

context: |
  This repository uses two complementary documentation layers:

  - openspec/specs/<capability>/spec.md is the canonical record of accepted,
    testable product behavior. Main specs are created or updated only when an
    OpenSpec change is synced or archived.
  - docs/ is supporting reference material. Read docs/requirements.md for
    product scope, docs/architecture/ for system design, docs/contract/ for
    API details, and docs/constitution/ for repository-wide constraints.
  - docs/tasks/overview.md defines change dependencies. Each numbered task file
    maps to the OpenSpec change with the numeric wave prefix removed.

  When drafting or reviewing a change, use docs as context and cite the relevant
  paths in the artifacts. Keep normative MUST/SHALL behavior in capability specs;
  do not copy broad explanatory documentation into a spec. If a spec and docs
  disagree, call out the conflict explicitly instead of silently choosing one.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
